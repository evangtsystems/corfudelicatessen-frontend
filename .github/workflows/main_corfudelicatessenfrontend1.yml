name: Build and deploy Next.js SSR to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_83043BD97F4C4A778CD969E3E16F800D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3C53092A20C14EECABE28ACEAD4CD11C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E45352F2763448BA8EA1F608873A82E6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CORFUDELICATESSENFRONTEND1'
          slot-name: 'Production'
          package: .
